<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Ally — Complete</title>
<link rel="icon" href="https://vibe.filesafe.space/1781548817483658086/attachments/4f7e2bb5-46d6-459e-8104-44ee1ccee4c0.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1A2A4A; --primary-dark:#0F1B33; --primary-light:#2C4A6E;
    --secondary:#1E3A5F; --accent:#2C4A6E; --accent-light:#3B6A8E;
    --highlight:#4A7A9E; --highlight-dark:#2C5F8A;
    --ink:#1A2A4A; --slate:#6B7A8E; --line:#DCE4EC; --canvas:#F5F7FA; --surface:#FFFFFF;
    --blue-soft:#E8EEF5; --amber-soft:#FFFBEB; --red-soft:#FEF2F2; --green-soft:#ECFDF5;
    --grad:linear-gradient(135deg,#1A2A4A 0%,#2C4A6E 50%,#4A7A9E 100%);
    --grad-dark:linear-gradient(135deg,#0F1B33 0%,#1E3A5F 50%,#2C4A6E 100%);
    --radius:14px; --shadow:0 1px 3px rgba(0,0,0,0.04),0 8px 28px rgba(26,42,74,0.08);
    --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --primary-glow:rgba(44,74,110,0.25);
  }
  [data-theme="dark"]{
    --ink:#EDF2F7; --slate:#9CA3AF; --line:#1E3A5F; --canvas:#0A1628; --surface:#0F1B33;
    --blue-soft:#1A2A4A; --amber-soft:#422B1A; --red-soft:#3B1A1A; --green-soft:#1A2E1A;
    --shadow:0 1px 3px rgba(0,0,0,0.4),0 8px 28px rgba(0,0,0,0.5);
    --primary-glow:rgba(44,74,110,0.2);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--canvas);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  :focus-visible{outline:2px solid var(--highlight);outline-offset:2px;border-radius:6px}
  a{color:inherit;text-decoration:none}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeInRight{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 20px var(--primary-glow)}50%{box-shadow:0 0 45px var(--primary-glow),0 0 70px rgba(44,74,110,0.12)}}
  @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(2deg)}}
  .fade-in{animation:fadeIn 0.4s ease forwards}
  .fade-in-right{animation:fadeInRight 0.4s ease forwards}
  .pulse-glow{animation:pulseGlow 3s ease-in-out infinite}
  .gradient-shift{background-size:200% 200% !important;animation:gradientShift 6s ease infinite}
  .logo-float{animation:logoFloat 4s ease-in-out infinite}
  .shell{display:flex;min-height:100vh}
  .sidebar{width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 16px;
    transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);overflow-y:auto;z-index:50}
  .sb-logo{padding:8px 4px 16px;border-bottom:1px solid var(--line);margin-bottom:16px;display:flex;justify-content:center;align-items:center}
  .sb-logo .logo-image{width:80px;height:80px;border-radius:16px;object-fit:contain;flex-shrink:0;box-shadow:0 4px 20px rgba(26,42,74,0.2);transition:transform 0.3s ease;background:var(--surface)}
  .sb-logo .logo-image:hover{transform:scale(1.05)}
  .sb-nav{flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;padding-top:8px}
  .sb-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;
    color:var(--slate);transition:all 0.2s;width:100%;text-align:left;cursor:pointer}
  .sb-item .ic{width:22px;text-align:center;font-size:16px}
  .sb-item:hover{background:var(--blue-soft);color:var(--highlight);transform:translateX(2px)}
  .sb-item.on{background:var(--blue-soft);color:var(--highlight);box-shadow:inset 3px 0 0 var(--highlight)}
  .sb-foot{border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
  .sb-role-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--slate);padding:0 10px 8px}
  .sb-role{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:12px}
  .sb-role button{padding:6px 8px;border-radius:8px;font-size:11px;font-weight:700;color:var(--slate);
    background:var(--canvas);border:1px solid transparent;transition:0.2s;cursor:pointer}
  .sb-role button.on{background:var(--grad);color:#fff;border-color:var(--highlight);box-shadow:0 2px 12px rgba(74,122,158,0.25)}
  .theme-toggle{width:100%;padding:9px;border-radius:10px;background:var(--canvas);color:var(--slate);
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid var(--line);transition:0.2s;cursor:pointer}
  .theme-toggle:hover{background:var(--blue-soft);color:var(--highlight);border-color:var(--highlight)}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:30}
  .menu-btn{display:none;font-size:20px;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:var(--surface)}
  .tb-search{position:relative;flex:1;max-width:400px}
  .tb-search input{width:100%;background:var(--canvas);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px 8px 38px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;transition:0.2s}
  .tb-search input:focus{border-color:var(--highlight);box-shadow:0 0 0 3px var(--blue-soft)}
  .tb-search .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--slate)}
  .tb-spacer{flex:1}
  .bell{position:relative;width:40px;height:40px;border-radius:10px;background:var(--canvas);
    border:1px solid var(--line);display:grid;place-items:center;font-size:17px;cursor:pointer;transition:0.2s}
  .bell:hover{background:var(--blue-soft);border-color:var(--highlight)}
  .bell .badge{position:absolute;top:-4px;right:-4px;background:var(--grad);color:#fff;font-size:10px;
    font-weight:700;min-width:18px;height:18px;border-radius:10px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);background-size:200% 200%;
    color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;cursor:pointer;
    animation:gradientShift 6s ease infinite;transition:0.3s;box-shadow:0 2px 8px rgba(26,42,74,0.15)}
  .avatar:hover{transform:scale(1.05)}
  .wrap{padding:28px 32px 80px;max-width:1280px;width:100%;margin:0 auto}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .page-head h1{font-size:28px;font-weight:800;letter-spacing:-0.025em;background:var(--grad);
    background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 6s ease infinite}
  .page-head .eyebrow{font-size:11px;font-weight:700;color:var(--highlight);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px}
  .page-head p{color:var(--slate);font-size:14px;margin-top:2px}
  .head-actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{background:var(--grad);background-size:200% 200%;color:#fff;padding:10px 20px;border-radius:10px;
    font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;
    box-shadow:0 2px 12px rgba(44,74,110,0.2);transition:all 0.3s;cursor:pointer;border:none;
    animation:gradientShift 6s ease infinite}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(44,74,110,0.3)}
  .btn:active{transform:scale(0.97)}
  .btn.ghost{background:var(--surface);color:var(--highlight);border:1.5px solid var(--line);box-shadow:none;animation:none}
  .btn.ghost:hover{background:var(--blue-soft);border-color:var(--highlight);transform:translateY(-2px)}
  .btn.sm{padding:6px 14px;font-size:12px}
  .btn-danger{background:var(--highlight);color:#fff;border:none;animation:none}
  .btn-danger:hover{background:var(--highlight-dark);transform:translateY(-2px);box-shadow:0 4px 16px rgba(44,95,138,0.25)}
  .comment-notifications{position:fixed;top:76px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:400px;width:100%;pointer-events:none}
  .comment-notifications .comment-notification{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,0.12);padding:16px 18px;pointer-events:auto;animation:fadeInRight 0.4s ease;border-left:4px solid var(--highlight);transition:all 0.3s ease}
  .comment-notifications .comment-notification:hover{transform:translateX(-4px);box-shadow:0 16px 48px rgba(0,0,0,0.15)}
  .comment-notifications .comment-notification .cn-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .comment-notifications .comment-notification .cn-author{font-weight:800;font-size:14px;color:var(--ink)}
  .comment-notifications .comment-notification .cn-task{font-size:12px;color:var(--slate);font-weight:600}
  .comment-notifications .comment-notification .cn-task span{color:var(--highlight)}
  .comment-notifications .comment-notification .cn-close{margin-left:auto;font-size:18px;color:var(--slate);cursor:pointer;padding:0 4px;line-height:1;transition:0.2s;background:none;border:none}
  .comment-notifications .comment-notification .cn-close:hover{color:var(--ink);transform:scale(1.2)}
  .comment-notifications .comment-notification .cn-body{font-size:14px;color:var(--ink);padding:4px 0 8px;line-height:1.4;word-break:break-word}
  .comment-notifications .comment-notification .cn-footer{display:flex;gap:8px;justify-content:flex-end;padding-top:6px;border-top:1px solid var(--line)}
  .comment-notifications .comment-notification .cn-footer .btn{font-size:12px;padding:4px 14px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;transition:all 0.3s}
  .panel:hover{box-shadow:0 4px 24px rgba(26,42,74,0.06)}
  .panel-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-head h2{font-size:16px;font-weight:800;letter-spacing:-0.02em}
  .panel-body{padding:16px 20px}
  .ph-spacer{flex:1}
  .kpis4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
  .kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px 14px;box-shadow:var(--shadow);transition:all 0.3s;position:relative;overflow:hidden}
  .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);background-size:200% 200%;animation:gradientShift 6s ease infinite}
  .kpi-card:hover{transform:translateY(-3px);box-shadow:0 6px 28px rgba(26,42,74,0.08)}
  .kpi-top{display:flex;align-items:center;justify-content:space-between}
  .kpi-top .lbl{font-size:11px;color:var(--slate);font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
  .kpi-card .v{font-size:28px;font-weight:800;letter-spacing:-0.03em;margin:6px 0 4px}
  .kpi-card .v small{font-size:14px;color:var(--slate);font-weight:600}
  .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:18px}
  .grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
  .rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
  .kpis3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
  .util-wrap{display:grid;place-items:center;padding:10px 0 4px}
  .util-c{position:relative;width:160px;height:160px}
  .util-c .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .util-c .mid .big{font-size:32px;font-weight:800;letter-spacing:-0.03em}
  .util-c .mid .sub{font-size:11px;color:var(--slate);font-weight:600}
  .util-legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--slate);font-weight:600;padding-bottom:4px}
  .util-legend .dot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .top-list{list-style:none}
  .top-list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .top-list li:last-child{border-bottom:none}
  .top-list .rank{width:22px;font-weight:800;color:var(--slate);font-size:13px}
  .top-list .tn{font-weight:700;font-size:13.5px}
  .top-list .tbar{flex:1;height:6px;background:var(--canvas);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .top-list .tbar i{display:block;height:100%;background:var(--grad);background-size:200% 200%;animation:gradientShift 6s ease infinite;border-radius:4px}
  .top-list .tv{font-weight:800;font-size:13px;min-width:44px;text-align:right}
  .search{display:flex;align-items:center;gap:8px;background:var(--canvas);border:1px solid var(--line);
    border-radius:10px;padding:6px 12px;min-width:160px}
  .search input{border:none;background:none;outline:none;font-size:14px;width:100%;font-family:inherit;color:var(--ink)}
  .sel{background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:8px 12px;
    font-size:13px;color:var(--ink);font-family:inherit;font-weight:600;cursor:pointer;transition:0.2s}
  .sel:focus{border-color:var(--highlight);box-shadow:0 0 0 3px var(--blue-soft)}
  .filter-tabs{display:flex;gap:4px;background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:3px}
  .filter-tabs button{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;color:var(--slate);
    cursor:pointer;background:none;border:none;transition:0.2s}
  .filter-tabs button.on{background:var(--surface);color:var(--highlight);box-shadow:0 1px 4px rgba(0,0,0,0.06)}
  .alert-banner{margin-bottom:18px;background:var(--surface);border:1px solid var(--line);
    border-left:4px solid var(--highlight);border-radius:var(--radius);padding:14px 20px;
    display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
  .alert-banner .ic{width:32px;height:32px;border-radius:8px;background:var(--blue-soft);color:var(--highlight);
    display:grid;place-items:center;font-size:16px;font-weight:800;flex-shrink:0}
  .alert-banner b{font-weight:800}.alert-banner .names{color:var(--slate);font-weight:600;font-size:13px;margin-top:2px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;color:var(--slate);font-weight:700;text-transform:uppercase;
    letter-spacing:0.04em;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--canvas)}
  td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.clickable{cursor:pointer;transition:background 0.15s}
  tr.clickable:hover{background:var(--blue-soft)}
  tfoot td{border-top:2px solid var(--line);background:var(--canvas)}
  .cli{display:flex;align-items:center;gap:12px}
  .ca{width:36px;height:36px;border-radius:10px;background:var(--blue-soft);color:var(--highlight);
    display:grid;place-items:center;font-weight:800;font-size:12px;flex-shrink:0}
  .ca.grad{background:var(--grad);background-size:200% 200%;animation:gradientShift 6s ease infinite;color:#fff}
  .cn{font-weight:700}.ce{font-size:12px;color:var(--slate)}
  .gauge{width:120px}
  .gauge .track{height:6px;background:var(--canvas);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .gauge .fill{height:100%;border-radius:4px;transition:width 0.6s ease}
  .gauge .cap{font-size:11px;color:var(--slate);margin-top:4px;font-weight:600}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
  .pill.ok{background:var(--blue-soft);color:var(--highlight)}
  .pill.low{background:var(--amber-soft);color:#D97706}
  .pill.crit{background:var(--red-soft);color:#DC2626}
  .pill.draft{background:transparent;border:1px solid var(--line);color:var(--slate)}
  .pill.todo{background:#E5E7EB;color:#6B7280}
  .pill.in-progress{background:#FFFBEB;color:#D97706}
  .pill.in-review{background:#EEF2FF;color:#6366F1}
  .pill.revision{background:#FEF2F2;color:#DC2626}
  .pill.complete{background:#ECFDF5;color:#059669}
  .pill.priority-high{background:#FEF2F2;color:#DC2626}
  .pill.priority-medium{background:#FFFBEB;color:#D97706}
  .pill.priority-low{background:#EEF2FF;color:#6366F1}
  .pill.tag{background:var(--blue-soft);color:var(--highlight);font-size:10px;padding:2px 8px;gap:3px}
  .pill.tag .tag-remove{font-size:10px;cursor:pointer;color:var(--slate);margin-left:2px;font-weight:700}
  .pill.tag .tag-remove:hover{color:var(--highlight)}
  .assignee-pill{display:inline-flex;align-items:center;gap:4px;background:var(--blue-soft);
    padding:2px 8px 2px 10px;border-radius:14px;font-size:12px;font-weight:600;color:var(--highlight)}
  .assignee-pill .remove-assign{font-size:12px;cursor:pointer;color:var(--slate);font-weight:700;margin-left:2px}
  .assignee-pill .remove-assign:hover{color:var(--highlight)}
  .icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
    display:grid;place-items:center;font-size:14px;color:var(--slate);transition:0.2s;cursor:pointer}
  .icon-btn:hover{background:var(--blue-soft);color:var(--highlight);border-color:var(--highlight);transform:scale(1.05)}
  .row-actions{display:flex;gap:4px;flex-wrap:wrap}
  .empty{padding:40px 20px;text-align:center;color:var(--slate)}
  .empty .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px}
  .feed{list-style:none}
  .feed li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;font-size:13px}
  .feed li:last-child{border-bottom:none}
  .feed .fi{width:30px;height:30px;border-radius:8px;background:var(--blue-soft);color:var(--highlight);
    display:grid;place-items:center;flex-shrink:0;font-size:13px}
  .feed .ft{font-weight:600;line-height:1.4}.feed .fd{color:var(--slate);font-size:11px;margin-top:1px}
  .feed .fa{margin-left:auto;font-weight:800;font-size:13px}
  .fa.plus{color:var(--highlight)}.fa.minus{color:var(--slate)}
  .month-nav{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 16px;margin-bottom:16px;flex-wrap:wrap}
  .mn-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
    font-size:16px;color:var(--slate);display:grid;place-items:center;cursor:pointer;transition:0.2s}
  .mn-btn:hover{background:var(--blue-soft);color:var(--highlight)}
  .mn-label{font-size:17px;font-weight:800;letter-spacing:-0.02em;min-width:140px}
  .mn-total{font-size:13px;color:var(--slate);font-weight:600}.mn-total b{color:var(--ink);font-size:15px}
  .timer-section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 24px;margin-bottom:20px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;
    align-items:center;gap:20px;position:relative;overflow:hidden}
  .timer-section::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);background-size:200% 200%;animation:gradientShift 6s ease infinite}
  .timer-display-wrap{display:flex;flex-direction:column;gap:4px;min-width:180px}
  .timer-display{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;
    background:var(--grad);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 6s ease infinite;line-height:1}
  .timer-break-display{font-size:18px;font-weight:700;color:var(--slate);display:flex;align-items:center;gap:8px}
  .timer-break-display .break-time{color:#F59E0B;font-weight:800}
  .timer-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

const remaining=c=>c.purchased-c.consumed;
const pct=c=>c.purchased?Math.max(0,Math.min(100,remaining(c)/c.purchased*100)):0;
const statusColor=s=>s==='crit'?'#DC2626':s==='low'?'#D97706':'#2C4A6E';
const statusLabel=s=>s==='crit'?'Out of hours':s==='low'?'Low balance':'Healthy';
const status=c=>{const r=remaining(c); if(r<=0)return'crit'; if(r<=state.threshold)return'low'; return'ok';};

const monthLabel=ym=>new Date(ym+'-01T00:00:00').toLocaleString('en',{month:'long',year:'numeric'});
function shiftMonth(ym,delta){let[y,m]=ym.split('-').map(Number); m+=delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+String(m).padStart(2,'0');}

function clientLogs(id){return state.logs.filter(l=>l.clientId===id).sort((a,b)=>b.date.localeCompare(a.date));}
function filterByDate(rows,from,to){return rows.filter(l=>(!from||l.date>=from)&&(!to||l.date<=to));}

function wireDateFilter(idPrefix,onChange){const f=document.getElementById(idPrefix+'From'),t=document.getElementById(idPrefix+'To'),c=document.getElementById(idPrefix+'Clear'); if(f)f.onchange=()=>onChange(f.value,t.value); if(t)t.onchange=()=>onChange(f.value,t.value); if(c)c.onclick=()=>onChange('','');}
function barChart(vals,labels,w=520,h=150){const pad=22,base=h-26,top=22,max=Math.max(1,...vals),n=vals.length,gap=8,bw=(w-pad*2-gap*(n-1))/n; let bars=''; for(let i=0;i<n;i++){const bh=(vals[i]/max)*(base-top),x=pad+i*(bw+gap),y=base-bh; bars+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(2,bh)+'" rx="4" fill="url(#bg)"/>'; bars+='<text x="'+(x+bw/2)+'" y="'+(h-6)+'" text-anchor="middle" font-size="10" fill="var(--slate)" font-weight="600">'+labels[i]+'</text>'; bars+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle" font-size="10" fill="var(--ink)" font-weight="800">'+(vals[i]?fmt(vals[i]):'')+'</text>';} return '<svg width="100%" viewBox="0 0 '+w+' '+h+'"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2A4A"/><stop offset="1" stop-color="#4A7A9E"/></linearGradient></defs>'+bars+'</svg>';}
function donutSVG(percent,color){const C=2*Math.PI*70,off=C*(1-percent/100); return '<svg width="170" height="170" viewBox="0 0 170 170"><defs><linearGradient id="ud" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A2A4A"/><stop offset="1" stop-color="#4A7A9E"/></linearGradient></defs><circle cx="85" cy="85" r="70" fill="none" stroke="var(--canvas)" stroke-width="14"/><circle cx="85" cy="85" r="70" fill="none" stroke="'+(color||'url(#ud)')+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 85 85)" style="transition:stroke-dashoffset .7s ease"/></svg>';}
function timesheetTable(rows,showClient,showBy){ if(!rows.length)return '<div class="empty" style="padding:30px"><div class="big">No entries yet</div></div>'; return '<table><thead><tr><th>Date</th>'+(showClient?'<th>Client</th>':'')+'<th>Hours</th><th>Note</th>'+(showBy?'<th>Logged by</th>':'')+'</tr></thead><tbody>'+rows.map(l=>{const c=state.clients.find(x=>x.id===l.clientId)||{}; return '<tr><td class="num" style="font-weight:700">'+fmtDate(l.date)+'</td>'+(showClient?'<td>'+(c.name||'—')+'</td>':'')+'<td class="num" style="font-weight:800;color:var(--highlight)">'+fmtHM(l.hours)+'</td><td>'+(l.note||'—')+'</td>'+(showBy?'<td class="ce">'+(l.by||'—')+'</td>':'')+'</tr>';}).join('')+'</tbody></table>';}

function getPriorityPill(p){const map={high:'priority-high',medium:'priority-medium',low:'priority-low'}; return map[p]||'priority-low';}
function getCommentReadStatus(comment,userId){return comment.readBy&&comment.readBy.includes(userId);}
function markCommentsRead(taskId,userId){ const t=state.tasks.find(x=>x.id===taskId); if(!t)return; const markRead=(comments)=>{ if(!comments)return; comments.forEach(c=>{if(!c.readBy)c.readBy=[]; if(!c.readBy.includes(userId))c.readBy.push(userId); if(c.replies)markRead(c.replies);}); }; markRead(t.comments); }
const statusOptions=[{value:'todo',label:'To do'},{value:'in-progress',label:'In progress'},{value:'in-review',label:'In review'},{value:'revision',label:'Revision'},{value:'complete',label:'Complete'}];
function removeAssignee(taskId,userId){ const t=state.tasks.find(x=>x.id===taskId); if(!t) return; if(!t.assignedTo) t.assignedTo=[]; t.assignedTo=t.assignedTo.filter(id=>id!==userId); logEvent('👤','Removed '+getUserName(userId)+' from task "'+t.title+'"',0); toast('Removed '+getUserName(userId),'brand'); renderTasks(); }
function addAssignee(taskId,userId){ const t=state.tasks.find(x=>x.id===taskId); if(!t) return; if(!t.assignedTo) t.assignedTo=[]; if(!t.assignedTo.includes(userId)){ t.assignedTo.push(userId); logEvent('👤','Added '+getUserName(userId)+' to task "'+t.title+'"',0); toast('Added '+getUserName(userId),'brand'); renderTasks(); } }

async function loadData(){
  console.log('⏳ Loading data...');
  const headers={'Content-Type':'application/json','Authorization':`Bearer ${state.authToken}`};
  const baseUrl='https://my-backend-ptmb.onrender.com';
  async function fetchData(url){
    try{
      const res=await fetch(url,{headers});
      if(res.status===401){
        localStorage.removeItem('va_token');localStorage.removeItem('va_user');
        state.isLoggedIn=false;state.authToken=null;state.authUser=null;
        toast('Session expired. Please login again.','error');render();return null;
      }
      if(!res.ok)return null;
      return await res.json();
    }catch(e){return null;}
  }
  const clientsData=await fetchData(baseUrl+'/api/clients');
  if(clientsData)state.clients=Array.isArray(clientsData)?clientsData.map(c=>({...c,id:c._id})):[];
  else state.clients=[];
  const tasksData=await fetchData(baseUrl+'/api/tasks');
  if(tasksData)state.tasks=Array.isArray(tasksData)?tasksData.map(t=>({...t,id:t._id})):[];
  else state.tasks=[];
  const teamData=await fetchData(baseUrl+'/api/team');
  if(teamData)state.team=Array.isArray(teamData)?teamData.map(u=>({...u,id:u._id})):[];
  else state.team=[];
  state.isDataLoaded=true;
  console.log('✅ Data loaded');
  render();
}

function getUserTimer(userId){ if(!state.userTimers[userId]){ state.userTimers[userId]={isRunning:false,isOnBreak:false,workingStart:null,breakStart:null,totalWorking:0,totalBreak:0,status:'stopped'}; } return state.userTimers[userId]; }
function getUserWorkSeconds(userId){ const t=getUserTimer(userId); let s=t.totalWorking; if(t.isRunning&&!t.isOnBreak&&t.workingStart){s+=(Date.now()-t.workingStart)/1000;} return s; }
function getUserBreakSeconds(userId){ const t=getUserTimer(userId); let s=t.totalBreak; if(t.isOnBreak&&t.breakStart){s+=(Date.now()-t.breakStart)/1000;} return s; }
function getWorkSeconds(){return getUserWorkSeconds(state.worker);}
function getBreakSeconds(){return getUserBreakSeconds(state.worker);}
function formatTime(sec){const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60); return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function updateTimerUI(){ const w=getWorkSeconds(),b=getBreakSeconds(); const wd=document.getElementById('timerDisplay'); if(wd)wd.textContent=formatTime(w); const bd=document.getElementById('breakDisplay'); if(bd)bd.textContent=formatTime(b); const t=getUserTimer(state.worker); const dot=document.getElementById('timerStatusDot'); if(dot){dot.className='dot '+(t.status==='running'?'running':t.status==='break'?'break':'stopped');} const lbl=document.getElementById('timerStatusLabel'); if(lbl)lbl.textContent=t.status.charAt(0).toUpperCase()+t.status.slice(1); const ws=document.getElementById('workSummary'); if(ws){const h=Math.floor(w/3600),m=Math.floor((w%3600)/60); ws.textContent=h+'h '+m+'m';} const bs=document.getElementById('breakSummary'); if(bs){const h=Math.floor(b/3600),m=Math.floor((b%3600)/60); bs.textContent=h+'h '+m+'m';} }
function timerLoop(){ updateTimerUI(); const t=getUserTimer(state.worker); if(t.isRunning||t.isOnBreak){ state.timer.rafId=requestAnimationFrame(timerLoop); } }
function startTimer(){ const userId=state.worker; const t=getUserTimer(userId); if(t.isRunning)return; t.isRunning=true;t.isOnBreak=false;t.status='running'; t.workingStart=Date.now();t.breakStart=null; if(state.timer.rafId)cancelAnimationFrame(state.timer.rafId); timerLoop(); toast('Timer started','brand'); if(state.screenshotInterval) clearInterval(state.screenshotInterval); state.screenshotInterval=setInterval(()=>{ const t2=getUserTimer(state.worker); if(t2.isRunning) captureAutoScreenshot(); },900000); renderUserDashboard(); }
function toggleBreak(){ const userId=state.worker; const t=getUserTimer(userId); if(!t.isRunning)return; if(t.isOnBreak){ if(t.breakStart){t.totalBreak+=(Date.now()-t.breakStart)/1000;} t.isOnBreak=false;t.breakStart=null;t.status='running'; t.workingStart=Date.now(); toast('Resumed working'); }else{ if(t.workingStart){t.totalWorking+=(Date.now()-t.workingStart)/1000;} t.isOnBreak=true;t.workingStart=null;t.status='break'; t.breakStart=Date.now(); toast('Break started ☕'); } updateTimerUI(); renderUserDashboard(); }
function endTimer(){ const userId=state.worker; const t=getUserTimer(userId); if(!t.isRunning&&t.totalWorking===0&&t.totalBreak===0)return; let w=t.totalWorking,b=t.totalBreak; if(t.isRunning){ if(t.isOnBreak&&t.breakStart){b+=(Date.now()-t.breakStart)/1000;} else if(t.workingStart){w+=(Date.now()-t.workingStart)/1000;} } const hours=Math.round((w/3600)*100)/100; const breakHours=Math.round((b/3600)*100)/100; state.timerActivity.push({user:userId,date:todayStr(),working:Math.round(w),break:Math.round(b),duration:hours,breakDuration:breakHours,start:new Date().toISOString(),end:new Date().toISOString(),screenshots:[]}); t.isRunning=false;t.isOnBreak=false;t.workingStart=null;t.breakStart=null;t.status='stopped'; t.totalWorking=0;t.totalBreak=0; if(state.timer.rafId){cancelAnimationFrame(state.timer.rafId);state.timer.rafId=null;} if(state.screenshotInterval){clearInterval(state.screenshotInterval);state.screenshotInterval=null;} toast('Day ended ✅','brand'); updateTimerUI(); renderUserDashboard(); if(state.view==='live') renderLiveActivity(); }

  const container = document.getElementById('commentNotifications');
  if (!container) return;
  const notif = document.createElement('div');
  notif.className = 'comment-notification fade-in-right';
  notif.innerHTML = `<div class="cn-content">
    <div class="cn-header">
      <span class="cn-author">${comment.authorName}</span>
      <span class="cn-task">on <span>"${taskTitle}"</span></span>
      <button class="cn-close" onclick="this.closest('.comment-notification').remove()">×</button>
    </div>
    <div class="cn-body">${comment.text}</div>
    <div class="cn-footer">
      <button class="btn sm" onclick="closeCommentNotifications(); openTaskDetail('${taskId}')">💬 Reply</button>
    </div>
  </div>`;
  container.appendChild(notif);
  setTimeout(() => {
    if (notif.parentElement) {
      notif.style.opacity = '0';
      notif.style.transform = 'translateX(50px)';
      notif.style.transition = 'all 0.3s ease';
      setTimeout(() => {
        if (notif.parentElement) notif.remove();

    }
  }, 6000);
}

const app=document.getElementById('app');
const NAV={admin:[['dashboard','📊','Overview'],['clients','👥','Clients'],['tasks','✅','Tasks'],['reports','📈','Reports'],['team','🔐','Team & Access'],['settings','⚙️','Settings'],['live','🔄','Live Activity'],['profile','👤','My Profile']],coadmin:[['dashboard','📊','Overview'],['clients','👥','Clients'],['tasks','✅','Tasks'],['reports','📈','Reports'],['team','🔐','Team & Access'],['live','🔄','Live Activity'],['profile','👤','My Profile']],user:[['dashboard','📊','Dashboard'],['worker','⏱','Timesheet'],['tasks','✅','My Tasks'],['profile','👤','My Profile']],client:[['clienthome','📋','My Hours'],['tasks','✅','My Tasks']]};

function render(){
  const savedToken=localStorage.getItem('va_token');
  const savedUser=localStorage.getItem('va_user');
  if(savedToken&&savedUser&&!state.isLoggedIn){
    try{state.authToken=savedToken;state.authUser=JSON.parse(savedUser);state.role=state.authUser.role;state.clientId=state.authUser.clientId||null;state.isLoggedIn=true;state.isDataLoaded=false;if(state.role==='client')state.view='clienthome';else state.view='dashboard';}catch(e){}
  }
  const sidebar=document.getElementById('sidebar'),topbar=document.querySelector('.topbar');
  if(!state.isLoggedIn){if(sidebar)sidebar.style.display='none';if(topbar)topbar.style.display='none';}else{if(sidebar)sidebar.style.display='';if(topbar)topbar.style.display='';}
  const roleSwitcher=document.getElementById('roleSwitch'),roleLabel=document.getElementById('roleSwitcherLabel');
  if(state.role==='admin'){roleSwitcher.style.display='grid';roleLabel.style.display='block';}else{roleSwitcher.style.display='none';roleLabel.style.display='none';}
  if(!state.isLoggedIn){const params=new URLSearchParams(window.location.search);if(params.has('token')&&params.has('email')){renderSetPassword(params.get('token'),params.get('email'));return;}renderLogin();return;}
  if(state.isLoggedIn&&!state.isDataLoaded){loadData();return;}
  const avatarEl=document.getElementById('navAvatar');
  if(state.profile.avatar&&(state.role==='user'||state.role==='admin'||state.role==='coadmin')){avatarEl.innerHTML='<img src="'+state.profile.avatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">';}else if(state.role==='client'){avatarEl.textContent=state.authUser?initials(state.authUser.name):'C';}else{avatarEl.textContent=state.role==='user'?initials(state.worker):state.role==='coadmin'?'SM':'A';}
  document.documentElement.dataset.theme=state.theme;
  document.getElementById('themeBtn').innerHTML=state.theme==='dark'?'☀️ Light mode':'🌙 Dark mode';
  document.querySelectorAll('#roleSwitch button').forEach(b=>b.classList.toggle('on',b.dataset.role===state.role));
  const items=NAV[state.role]||[];
  const activeTop=state.view==='clientDetail'?'clients':state.view;
  document.getElementById('sbNav').innerHTML=items.map(([v,ic,l])=>'<button class="sb-item '+(activeTop===v?'on':'')+'" data-nav="'+v+'"><span class="ic">'+ic+'</span>'+l+'</button>').join('');
  document.querySelector('.tb-search').style.visibility=(state.role==='admin'||state.role==='coadmin')?'visible':'hidden';
  renderBell();
  if(state.view==='settings'&&state.role!=='admin')state.view='dashboard';
  if(state.view==='team'&&state.role!=='admin'&&state.role!=='coadmin')state.view='dashboard';
  if((state.role==='admin'||state.role==='coadmin'||state.role==='user')&&state.view==='profile')return renderProfile();
  if(state.role==='user'&&state.view==='tasks')return renderTasks();
  if(state.role==='client'&&state.view==='tasks')return renderTasks();
  if(state.role==='user'&&state.view==='dashboard')return renderUserDashboard();
  if(state.role==='user')return renderWorker();
  if(state.role==='client')return renderClient();
  const views={dashboard:renderDashboard,clients:renderClients,clientDetail:renderDetail,reports:renderReports,invoices:renderInvoices,team:renderTeam,settings:renderSettings,tasks:renderTasks,live:renderLiveActivity};
  (views[state.view]||renderDashboard)();
}
function renderBell(){const n=lowClients().length,badge=document.getElementById('bellBadge');badge.textContent=n;badge.style.display=n?'grid':'none';const list=document.getElementById('notifList');if(!n){list.innerHTML='<li style="color:var(--slate);font-size:13px">All clear — no clients below '+state.threshold+' hours.</li>';return;}list.innerHTML=lowClients().sort((a,b)=>remaining(a)-remaining(b)).map(c=>{const crit=status(c)==='crit';return '<li><span class="ni '+(crit?'crit':'')+'">'+(crit?'✕':'!')+'</span><div><div class="nt">'+c.name+'</div><div class="nd">'+(crit?'Out of hours — needs a top-up':fmt(remaining(c))+' hours left (below '+state.threshold+')')+'</div></div></li>';}).join('');}

function renderDashboard(){
  const cs=state.clients,sold=cs.reduce((a,c)=>a+c.purchased,0),used=cs.reduce((a,c)=>a+c.consumed,0),low=lowClients().length;
  const util=sold?Math.round(used/sold*100):0,revenue=used*state.rate;
  const top=[...cs].sort((a,b)=>b.consumed-a.consumed).slice(0,5),maxC=Math.max(1,...top.map(c=>c.consumed));
  const userName=state.authUser?.name||state.worker;
  app.innerHTML='<div class="page-head"><div><div class="eyebrow">'+(state.role==='admin'?'Owner':'Admin')+' workspace</div><h1>Overview</h1><p>Welcome back, <strong>'+userName+'</strong>! Here\'s your agency at a glance.</p></div><div class="head-actions"><button class="btn ghost" id="qLog">⏱ Log hours</button><button class="btn" id="qPurchase">💳 Record purchase</button></div></div><div class="kpis4"><div class="kpi-card"><div class="kpi-top"><span class="lbl">Active clients</span></div><div class="v num">'+cs.length+'</div></div><div class="kpi-card"><div class="kpi-top"><span class="lbl">Hours sold</span></div><div class="v num">'+fmt(sold)+'</div></div><div class="kpi-card"><div class="kpi-top"><span class="lbl">Hours consumed</span></div><div class="v num">'+fmt(used)+' <small>/ '+fmt(sold)+'</small></div></div><div class="kpi-card"><div class="kpi-top"><span class="lbl">Est. revenue</span></div><div class="v num">'+money(revenue)+'</div></div></div>'+(low?'<div class="alert-banner"><span class="ic">!</span><div><b>'+low+' client'+(low>1?'s are':' is')+' at or below '+state.threshold+' hours.</b><div class="names">'+lowClients().sort((a,b)=>remaining(a)-remaining(b)).map(c=>c.name+' ('+fmt(remaining(c))+'h)').join('  ·  ')+'</div></div></div>':'')+'<div class="grid2"><div class="panel"><div class="panel-head"><h2>Hours consumed</h2><div class="ph-spacer"></div><span class="ce">Last 6 months</span></div><div class="panel-body">'+barChart(state.trend,MONTHS,560,170)+'</div></div><div class="panel"><div class="panel-head"><h2>Utilization</h2></div><div class="panel-body"><div class="util-wrap"><div class="util-c">'+donutSVG(util)+'<div class="mid"><div class="big num">'+util+'%</div><div class="sub">of hours used</div></div></div></div><div class="util-legend"><span><span class="dot" style="background:#1A2A4A"></span>Used '+fmt(used)+'h</span><span><span class="dot" style="background:var(--canvas);border:1px solid var(--line)"></span>Remaining '+fmt(sold-used)+'h</span></div></div></div></div><div class="grid2b"><div class="panel"><div class="panel-head"><h2>Top clients by usage</h2></div><div class="panel-body"><ul class="top-list">'+top.map((c,i)=>'<li><span class="rank">'+(i+1)+'</span><span class="ca">'+initials(c.name)+'</span><div style="min-width:120px"><div class="tn">'+c.name+'</div></div><span class="tbar"><i style="width:'+(c.consumed/maxC*100)+'%"></i></span><span class="tv num">'+fmt(c.consumed)+'h</span></li>').join('')+'</ul></div></div><div class="panel"><div class="panel-head"><h2>Recent activity</h2></div><div class="panel-body"><ul class="feed">'+state.events.slice(0,6).map(e=>'<li><span class="fi">'+e.ic+'</span><div><div class="ft">'+e.text+'</div><div class="fd">'+e.d+'</div></div>'+(e.amt?'<span class="fa '+(e.amt>0?'plus':'minus')+'">'+(e.amt>0?'+':'')+fmt(e.amt)+'h</span>':'')+'</li>').join('')+'</ul></div></div></div>';
  document.getElementById('qLog').onclick=()=>openLog(); document.getElementById('qPurchase').onclick=()=>openPurchaseIntake();
}
function renderClients(){
  const cs=state.clients,isAdmin=state.role==='admin'||state.role==='coadmin';
  let fil=cs.filter(c=>c.name.toLowerCase().includes(state.search.toLowerCase()));
  if(state.filter!=='all')fil=fil.filter(c=>status(c)===state.filter);
  const S={remaining:(a,b)=>remaining(a)-remaining(b),name:(a,b)=>a.name.localeCompare(b.name),consumed:(a,b)=>b.consumed-a.consumed,purchased:(a,b)=>b.purchased-a.purchased};
  fil.sort(S[state.sort]);
  const cnt={all:cs.length,ok:cs.filter(c=>status(c)==='ok').length,low:cs.filter(c=>status(c)==='low').length,crit:cs.filter(c=>status(c)==='crit').length};
  app.innerHTML='<div class="page-head"><div><div class="eyebrow">Clients</div><h1>All clients</h1><p>'+cs.length+' clients · each with its own hours sheet.</p></div><div class="head-actions"><button class="btn ghost sm" id="exportBtn">⬇ Export CSV</button>'+(isAdmin?'<button class="btn" id="addBtn">＋ Add client</button>':'')+'</div></div><div class="panel"><div class="panel-head"><div class="filter-tabs" id="filterTabs">'+[['all','All '+cnt.all],['ok','Healthy '+cnt.ok],['low','Low '+cnt.low],['crit','Out '+cnt.crit]].map(([v,l])=>'<button data-f="'+v+'" class="'+(state.filter===v?'on':'')+'">'+l+'</button>').join('')+'</div><div class="ph-spacer"></div><div class="search"><span>🔍</span><input id="searchInp" placeholder="Search" value="'+state.search+'"></div><select class="sel" id="sortSel"><option value="remaining"'+(state.sort==='remaining'?' selected':'')+'>Least remaining</option><option value="name"'+(state.sort==='name'?' selected':'')+'>Name (A–Z)</option><option value="consumed"'+(state.sort==='consumed'?' selected':'')+'>Most consumed</option><option value="purchased"'+(state.sort==='purchased'?' selected':'')+'>Most purchased</option></select></div>'+(fil.length?'<table><thead><tr><th>Client</th><th>Balance</th><th>Consumed</th><th>Remaining</th><th>Status</th><th></th></tr></thead><tbody>'+fil.map(c=>{const s=status(c);return '<tr class="clickable" data-open="'+c.id+'"><td><div class="cli"><span class="ca">'+initials(c.name)+'</span><div><div class="cn">'+c.name+'</div><div class="ce">'+c.email+'</div></div></div></td><td><div class="gauge"><div class="track"><div class="fill" style="width:'+pct(c)+'%;background:'+(s==='ok'?'var(--grad)':statusColor(s))+'"></div></div><div class="cap num">'+fmt(remaining(c))+' of '+fmt(c.purchased)+'h</div></div></td><td class="num">'+fmt(c.consumed)+'h</td><td class="num" style="font-weight:800">'+fmt(remaining(c))+'h</td><td><span class="pill '+s+'"><span class="d"></span>'+statusLabel(s)+'</span></td><td><div class="row-actions"><button class="icon-btn" data-log="'+c.id+'">⏱</button><button class="icon-btn" data-add="'+c.id+'">＋</button>'+(isAdmin?'<button class="icon-btn" data-edit="'+c.id+'">✎</button>':'')+'</div></td></tr>';}).join('')+'</tbody></table>':'<div class="empty"><div class="big">No clients here</div>Try a different filter or search.</div>')+'</div>';
  const si=document.getElementById('searchInp');if(si)si.oninput=e=>{state.search=e.target.value;renderClients();};
  const ss=document.getElementById('sortSel');if(ss)ss.onchange=e=>{state.sort=e.target.value;renderClients();};
  app.querySelectorAll('#filterTabs button').forEach(b=>b.onclick=()=>{state.filter=b.dataset.f;renderClients();});
  document.getElementById('exportBtn').onclick=exportCSV;
  document.getElementById('addBtn')?.addEventListener('click',openAdd);
  app.querySelectorAll('[data-open]').forEach(r=>r.onclick=()=>{state.detailId=r.dataset.open;state.view='clientDetail';render();});
  app.querySelectorAll('[data-log]').forEach(b=>b.onclick=e=>{e.stopPropagation();openLog(b.dataset.log);});
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.stopPropagation();openBuy(b.dataset.add);});
  app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation();openEdit(b.dataset.edit);});
}
function renderDetail(){
  const c=state.clients.find(x=>x.id===state.detailId);
  if(!c){state.view='clients';return renderClients();}
  const s=status(c),isAdmin=state.role==='admin'||state.role==='coadmin';
  app.innerHTML='<button class="back" id="backBtn">← Back to clients</button><div class="detail-head"><span class="big-av">'+initials(c.name)+'</span><div style="flex:1"><h1>'+c.name+'</h1><div class="ce">'+c.email+'</div></div><span class="pill '+s+'"><span class="d"></span>'+statusLabel(s)+'</span><div class="head-actions"><button class="btn ghost sm" data-log="'+c.id+'">⏱ Log hours</button><button class="btn ghost sm" data-add="'+c.id+'">＋ Add hours</button>'+(isAdmin?'<button class="btn sm" data-edit="'+c.id+'">✎ Edit</button>':'')+'<button class="btn sm" data-taskclient="'+c.id+'">📋 Tasks</button></div></div><div class="kpis3"><div class="kpi"><div class="lbl">Purchased</div><div class="v num">'+fmt(c.purchased)+'h</div></div><div class="kpi"><div class="lbl">Consumed</div><div class="v num">'+fmt(c.consumed)+'h</div></div><div class="kpi"><div class="lbl">Remaining</div><div class="v num" style="color:'+statusColor(s)+'">'+fmt(remaining(c))+'h</div></div></div><div class="grid2"><div class="panel"><div class="panel-head"><h2>Usage history</h2><div class="ph-spacer"></div><span class="ce">Hours / month</span></div><div class="panel-body">'+barChart(c.history||[0,0,0,0,0,0],MONTHS,540,170)+'</div></div><div class="panel"><div class="panel-head"><h2>Balance</h2></div><div class="panel-body" style="text-align:center"><div class="util-wrap"><div class="util-c">'+donutSVG(pct(c),s==='ok'?null:statusColor(s))+'<div class="mid"><div class="big num">'+fmt(remaining(c))+'</div><div class="sub">of '+fmt(c.purchased)+'h</div></div></div></div><div class="refer-stat" style="justify-content:center">🎁 Referrals: <b>'+(c.referrals||0)+'</b></div></div></div></div><div class="panel"><div class="panel-head"><h2>Timesheet</h2><div class="ph-spacer"></div>'+dateFilterBar('detDate',state.detailDateFrom,state.detailDateTo)+'</div>'+timesheetTable(filterByDate(clientLogs(c.id),state.detailDateFrom,state.detailDateTo),false,true)+'</div>';
  document.getElementById('backBtn').onclick=()=>{state.view='clients';render();};
  app.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>openLog(b.dataset.log));
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openBuy(b.dataset.add));
  app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));
  app.querySelectorAll('[data-taskclient]').forEach(b=>b.onclick=()=>{state.view='tasks';state.taskFilterClient=b.dataset.taskclient;render();});
  wireDateFilter('detDate',(from,to)=>{state.detailDateFrom=from;state.detailDateTo=to;renderDetail();});
}
function renderReports(){
  const cs=state.clients,sold=cs.reduce((a,c)=>a+c.purchased,0),used=cs.reduce((a,c)=>a+c.consumed,0),util=sold?Math.round(used/sold*100):0;
  const byClient=[...cs].sort((a,b)=>b.consumed-a.consumed),maxC=Math.max(1,...byClient.map(c=>c.consumed));
  app.innerHTML='<div class="page-head"><div><div class="eyebrow">Analytics</div><h1>Reports</h1><p>Consumption, revenue, and utilization trends.</p></div><div class="head-actions"><button class="btn ghost sm" id="exportBtn">⬇ Export clients</button></div></div><div class="kpis4"><div class="kpi-card"><div class="kpi-top"><span class="lbl">Total sold</span></div><div class="v num">'+fmt(sold)+'h</div></div><div class="kpi-card"><div class="kpi-top"><span class="lbl">Total consumed</span></div><div class="v num">'+fmt(used)+'h</div></div><div class="kpi-card"><div class="kpi-top"><span class="lbl">Utilization</span></div><div class="v num">'+util+'%</div></div><div class="kpi-card"><div class="kpi-top"><span class="lbl">Est. revenue</span></div><div class="v num">'+money(used*state.rate)+'</div></div></div><div class="rep-grid"><div class="panel"><div class="panel-head"><h2>Consumption by month</h2></div><div class="panel-body">'+barChart(state.trend,MONTHS,540,180)+'</div></div><div class="panel"><div class="panel-head"><h2>Revenue by month</h2></div><div class="panel-body">'+barChart(state.trend.map(t=>Math.round(t*state.rate)),MONTHS,540,180)+'</div></div></div><div class="panel"><div class="panel-head"><h2>Hours consumed by client</h2></div><div class="panel-body"><ul class="top-list">'+byClient.map(c=>'<li><span class="ca">'+initials(c.name)+'</span><div style="min-width:140px"><div class="tn">'+c.name+'</div><div class="ce">'+fmt(remaining(c))+'h remaining</div></div><span class="tbar"><i style="width:'+(c.consumed/maxC*100)+'%"></i></span><span class="tv num">'+fmt(c.consumed)+'h</span></li>').join('')+'</ul></div></div>';
  document.getElementById('exportBtn').onclick=exportCSV;
}
function renderInvoices(){
  const iv=state.invoices,outstanding=iv.filter(x=>x.status!=='paid').reduce((a,x)=>a+invAmount(x),0),paid=iv.filter(x=>x.status==='paid').reduce((a,x)=>a+invAmount(x),0);

  document.getElementById('newInv').onclick=openInvoice;
  app.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>openSendInvoice(b.dataset.send));

  app.querySelectorAll('[data-view-inv]').forEach(b=>b.onclick=()=>viewInvoice(b.dataset.viewInv));

function renderTeam(){
  if(state.role!=='admin'&&state.role!=='coadmin'){state.view='dashboard';render();return;}
  const roleOpts=['admin','coadmin','user','client'];
  const isOwner=state.role==='admin';
  app.innerHTML='<div class="page-head"><div><div class="eyebrow">'+(isOwner?'Owner':'Admin')+' Access</div><h1>Team & Access</h1><p>'+(isOwner?'Full control over team members.':'Manage team members.')+'</p></div>'+(isOwner?'<div class="head-actions"><button class="btn" id="inviteBtn">＋ Invite member</button></div>':'')+'</div><div class="info-note"><span>🔐</span><div><b>Access levels.</b> Owner — full control. Admin — clients, hours, reports & invoices; no team/settings. User — staff who log hours worked each day. Client — sees only their own sheet, never other clients or users.</div></div><div class="panel"><table><thead><tr><th>Member</th><th>Email</th><th>Role</th><th>Linked client</th><th>Status</th><th></th></tr></thead><tbody>'+state.team.map(m=>'<tr><td><div class="cli"><span class="ca '+(m.role==='admin'?'grad':'')+'">'+initials(m.name)+'</span><div class="cn">'+m.name+'</div></div></td><td class="ce">'+m.email+'</td><td><select class="sel" data-role-for="'+m.id+'" '+(m.email===state.authUser?.email||!isOwner?'disabled':'')+'>'+roleOpts.map(r=>'<option value="'+r+'"'+(m.role===r?' selected':'')+'>'+roleLabel(r)+'</option>').join('')+'</select></td><td class="ce">'+(m.role==='client'?((state.clients.find(c=>c.id===m.clientId)||{}).name||'—'):m.role==='user'?((m.assigned||[]).length+' clients'):'—')+'</td><td><span class="pill '+(m.status==='active'?'ok':'low')+'"><span class="d"></span>'+(m.status==='active'?'Active':'Invited')+'</span></td><td><div class="row-actions">'+(m.role==='user'&&isOwner?'<button class="icon-btn" data-assign="'+m.id+'">👥</button>':'')+(m.email===state.authUser?.email?'<span class="ce">You</span>':(isOwner?'<button class="icon-btn" data-rm="'+m.id+'">🗑</button>':''))+'</div></td></tr>').join('')+'</tbody></table></div>';
  if(isOwner){
    app.querySelectorAll('[data-role-for]').forEach(sel=>{
      sel.onchange=async(e)=>{
        const m=state.team.find(x=>x.id===sel.dataset.roleFor);
        if(!m)return;
        const newRole=e.target.value;
        try{
          const res=await fetch(`https://my-backend-ptmb.onrender.com/api/users/${m.id}/role`,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${state.authToken}`},body:JSON.stringify({role:newRole})});
          if(!res.ok)throw new Error('Failed');
          m.role=newRole;
          if(m.email===state.authUser?.email){state.role=newRole;state.authUser.role=newRole;if(newRole==='client')state.view='clienthome';else state.view='dashboard';}
          toast('Role updated!','brand');
          state.isDataLoaded=false;
          render();
        }catch(err){toast('Error: '+err.message);}
      };
    });
    app.querySelectorAll('[data-rm]').forEach(b=>{b.onclick=async(e)=>{e.stopPropagation();const id=b.dataset.rm;if(!confirm('Remove this user?'))return;try{const res=await fetch(`https://my-backend-ptmb.onrender.com/api/users/${id}`,{method:'DELETE',headers:{'Authorization':`Bearer ${state.authToken}`}});if(!res.ok)throw new Error('Failed');toast('User removed!','brand');state.isDataLoaded=false;render();}catch(err){toast('Error: '+err.message);}};});
    app.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>openAssign(b.dataset.assign));

  }
}

function renderTasks(){

  if(state.taskFilterClient!=='all')tasks=tasks.filter(t=>t.clientId===state.taskFilterClient);
  if(state.taskFilterAssignee!=='all')tasks=tasks.filter(t=>t.assignedTo&&t.assignedTo.includes(state.taskFilterAssignee));

:0;const subLabel=subCount>0?doneCount+'/'+subCount:'';return '<tr class="task-row-clickable" data-taskopen="'+t.id+'"><td><div><div class="cn" style="font-weight:700">'+t.title+'</div><div class="ce">'+(t.description?t.description.substring(0,40)+(t.description.length>40?'...':''):'No description')+' <span style="color:var(--slate);font-size:10px">📋 '+subLabel+'</span></div></div></td><td>'+(cl?cl.name:'—')+'</td><td>'+assigneeHtml+'</td><td class="num">'+(t.dueDate?fmtDate(t.dueDate):'—')+'</td><td><span class="pill '+statusPill+'">'+t.status.replace('-',' ')+'</span></td><td><span class="pill '+priorityPill+'">'+t.priority.toUpperCase()+'</span></td><td><div class="row-actions"><button class="icon-btn" data-taskedit="'+t.id+'">✎</button><button class="icon-btn" data-taskopen="'+t.id+'">📋</button></div></td></tr>';}).join('')+'</tbody></table>':'<div class="empty"><div class="big">No tasks found</div></div>')+'</div>';

// ============================================================
document.addEventListener('click', function(e) {
  // 1. Navigation (Sidebar)
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    e.preventDefault();
    const view = nav.dataset.nav;
    if (view && state.view !== view) {
      state.view = view;
      document.getElementById('sidebar')?.classList.remove('open');
      render();
    }
    return;
  }

  // 2. Role Switcher (View as)
  const roleBtn = e.target.closest('#roleSwitch button');
  if (roleBtn && roleBtn.dataset.role) {
    e.preventDefault();
    if (state.role !== 'admin') {
      toast('Only Owner can switch views', 'error');
      return;
    }
    const newRole = roleBtn.dataset.role;
    state.role = newRole;
    state.view = (newRole === 'user') ? 'dashboard' : (newRole === 'client') ? 'clienthome' : 'dashboard';
    state.detailId = null;
    document.getElementById('sidebar')?.classList.remove('open');
    render();
    toast('Switched to ' + roleLabel(newRole), 'brand');
  }
});
