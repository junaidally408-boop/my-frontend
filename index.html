<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Ally — Complete</title>
<link rel="icon" href="https://vibe.filesafe.space/1781548817483658086/attachments/4f7e2bb5-46d6-459e-8104-44ee1ccee4c0.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1A2A4A; --primary-dark:#0F1B33; --primary-light:#2C4A6E;
    --secondary:#1E3A5F; --accent:#2C4A6E; --accent-light:#3B6A8E;
    --highlight:#4A7A9E; --highlight-dark:#2C5F8A;
    --ink:#1A2A4A; --slate:#6B7A8E; --line:#DCE4EC; --canvas:#F5F7FA; --surface:#FFFFFF;
    --blue-soft:#E8EEF5; --amber-soft:#FFFBEB; --red-soft:#FEF2F2; --green-soft:#ECFDF5;
    --grad:linear-gradient(135deg,#1A2A4A 0%,#2C4A6E 50%,#4A7A9E 100%);
    --grad-dark:linear-gradient(135deg,#0F1B33 0%,#1E3A5F 50%,#2C4A6E 100%);
    --radius:14px; --shadow:0 1px 3px rgba(0,0,0,0.04),0 8px 28px rgba(26,42,74,0.08);
    --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --primary-glow:rgba(44,74,110,0.25);
  }
  [data-theme="dark"]{
    --ink:#EDF2F7; --slate:#9CA3AF; --line:#1E3A5F; --canvas:#0A1628; --surface:#0F1B33;
    --blue-soft:#1A2A4A; --amber-soft:#422B1A; --red-soft:#3B1A1A; --green-soft:#1A2E1A;
    --shadow:0 1px 3px rgba(0,0,0,0.4),0 8px 28px rgba(0,0,0,0.5);
    --primary-glow:rgba(44,74,110,0.2);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--canvas);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  :focus-visible{outline:2px solid var(--highlight);outline-offset:2px;border-radius:6px}
  a{color:inherit;text-decoration:none}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeInRight{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 20px var(--primary-glow)}50%{box-shadow:0 0 45px var(--primary-glow),0 0 70px rgba(44,74,110,0.12)}}
  @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(2deg)}}
  .fade-in{animation:fadeIn 0.4s ease forwards}
  .fade-in-right{animation:fadeInRight 0.4s ease forwards}
  .pulse-glow{animation:pulseGlow 3s ease-in-out infinite}
  .gradient-shift{background-size:200% 200% !important;animation:gradientShift 6s ease infinite}
  .logo-float{animation:logoFloat 4s ease-in-out infinite}
  .shell{display:flex;min-height:100vh}
  .sidebar{width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 16px;
    transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);overflow-y:auto;z-index:50}
  .sb-logo{padding:8px 4px 16px;border-bottom:1px solid var(--line);margin-bottom:16px;display:flex;justify-content:center;align-items:center}
  .sb-logo .logo-image{width:80px;height:80px;border-radius:16px;object-fit:contain;flex-shrink:0;box-shadow:0 4px 20px rgba(26,42,74,0.2);transition:transform 0.3s ease;background:var(--surface)}
  .sb-logo .logo-image:hover{transform:scale(1.05)}
  .sb-nav{flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;padding-top:8px}
  .sb-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;
    color:var(--slate);transition:all 0.2s;width:100%;text-align:left;cursor:pointer}
  .sb-item .ic{width:22px;text-align:center;font-size:16px}
  .sb-item:hover{background:var(--blue-soft);color:var(--highlight);transform:translateX(2px)}
  .sb-item.on{background:var(--blue-soft);color:var(--highlight);box-shadow:inset 3px 0 0 var(--highlight)}
  .sb-foot{border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
  .sb-role-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--slate);padding:0 10px 8px}
  .sb-role{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:12px}
  .sb-role button{padding:6px 8px;border-radius:8px;font-size:11px;font-weight:700;color:var(--slate);
    background:var(--canvas);border:1px solid transparent;transition:0.2s;cursor:pointer}
  .sb-role button.on{background:var(--grad);color:#fff;border-color:var(--highlight);box-shadow:0 2px 12px rgba(74,122,158,0.25)}
  .theme-toggle{width:100%;padding:9px;border-radius:10px;background:var(--canvas);color:var(--slate);
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid var(--line);transition:0.2s;cursor:pointer}
  .theme-toggle:hover{background:var(--blue-soft);color:var(--highlight);border-color:var(--highlight)}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:30}
  .menu-btn{display:none;font-size:20px;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:var(--surface)}
  .tb-search{position:relative;flex:1;max-width:400px}
  .tb-search input{width:100%;background:var(--canvas);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px 8px 38px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;transition:0.2s}
  .tb-search input:focus{border-color:var(--highlight);box-shadow:0 0 0 3px var(--blue-soft)}
  .tb-search .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--slate)}
  .tb-spacer{flex:1}
  .bell{position:relative;width:40px;height:40px;border-radius:10px;background:var(--canvas);
    border:1px solid var(--line);display:grid;place-items:center;font-size:17px;cursor:pointer;transition:0.2s}
  .bell:hover{background:var(--blue-soft);border-color:var(--highlight)}
  .bell .badge{position:absolute;top:-4px;right:-4px;background:var(--grad);color:#fff;font-size:10px;
    font-weight:700;min-width:18px;height:18px;border-radius:10px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);background-size:200% 200%;
    color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;cursor:pointer;
    animation:gradientShift 6s ease infinite;transition:0.3s;box-shadow:0 2px 8px rgba(26,42,74,0.15)}
  .avatar:hover{transform:scale(1.05)}
  .wrap{padding:28px 32px 80px;max-width:1280px;width:100%;margin:0 auto}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .page-head h1{font-size:28px;font-weight:800;letter-spacing:-0.025em;background:var(--grad);
    background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 6s ease infinite}
  .page-head .eyebrow{font-size:11px;font-weight:700;color:var(--highlight);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px}
  .page-head p{color:var(--slate);font-size:14px;margin-top:2px}
  .head-actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{background:var(--grad);background-size:200% 200%;color:#fff;padding:10px 20px;border-radius:10px;
    font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;
    box-shadow:0 2px 12px rgba(44,74,110,0.2);transition:all 0.3s;cursor:pointer;border:none;
    animation:gradientShift 6s ease infinite}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(44,74,110,0.3)}
  .btn:active{transform:scale(0.97)}
  .btn.ghost{background:var(--surface);color:var(--highlight);border:1.5px solid var(--line);box-shadow:none;animation:none}
  .btn.ghost:hover{background:var(--blue-soft);border-color:var(--highlight);transform:translateY(-2px)}
  .btn.sm{padding:6px 14px;font-size:12px}
  .btn-danger{background:var(--highlight);color:#fff;border:none;animation:none}
  .btn-danger:hover{background:var(--highlight-dark);transform:translateY(-2px);box-shadow:0 4px 16px rgba(44,95,138,0.25)}
  .comment-notifications{position:fixed;top:76px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:400px;width:100%;pointer-events:none}
  .comment-notifications .comment-notification{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,0.12);padding:16px 18px;pointer-events:auto;animation:fadeInRight 0.4s ease;border-left:4px solid var(--highlight);transition:all 0.3s ease}
  .comment-notifications .comment-notification:hover{transform:translateX(-4px);box-shadow:0 16px 48px rgba(0,0,0,0.15)}
  .comment-notifications .comment-notification .cn-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .comment-notifications .comment-notification .cn-author{font-weight:800;font-size:14px;color:var(--ink)}
  .comment-notifications .comment-notification .cn-task{font-size:12px;color:var(--slate);font-weight:600}
  .comment-notifications .comment-notification .cn-task span{color:var(--highlight)}
  .comment-notifications .comment-notification .cn-close{margin-left:auto;font-size:18px;color:var(--slate);cursor:pointer;padding:0 4px;line-height:1;transition:0.2s;background:none;border:none}
  .comment-notifications .comment-notification .cn-close:hover{color:var(--ink);transform:scale(1.2)}
  .comment-notifications .comment-notification .cn-body{font-size:14px;color:var(--ink);padding:4px 0 8px;line-height:1.4;word-break:break-word}
  .comment-notifications .comment-notification .cn-footer{display:flex;gap:8px;justify-content:flex-end;padding-top:6px;border-top:1px solid var(--line)}
  .comment-notifications .comment-notification .cn-footer .btn{font-size:12px;padding:4px 14px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;transition:all 0.3s}
  .panel:hover{box-shadow:0 4px 24px rgba(26,42,74,0.06)}
  .panel-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-head h2{font-size:16px;font-weight:800;letter-spacing:-0.02em}
  .panel-body{padding:16px 20px}
  .ph-spacer{flex:1}
  .kpis4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
  .kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px 14px;box-shadow:var(--shadow);transition:all 0.3s;position:relative;overflow:hidden}
  .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);background-size:200% 200%;animation:gradientShift 6s ease infinite}
  .kpi-card:hover{transform:translateY(-3px);box-shadow:0 6px 28px rgba(26,42,74,0.08)}
  .kpi-top{display:flex;align-items:center;justify-content:space-between}
  .kpi-top .lbl{font-size:11px;color:var(--slate);font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
  .kpi-card .v{font-size:28px;font-weight:800;letter-spacing:-0.03em;margin:6px 0 4px}
  .kpi-card .v small{font-size:14px;color:var(--slate);font-weight:600}
  .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:18px}
  .grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
  .rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
  .kpis3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
  .util-wrap{display:grid;place-items:center;padding:10px 0 4px}
  .util-c{position:relative;width:160px;height:160px}
  .util-c .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .util-c .mid .big{font-size:32px;font-weight:800;letter-spacing:-0.03em}
  .util-c .mid .sub{font-size:11px;color:var(--slate);font-weight:600}
  .util-legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--slate);font-weight:600;padding-bottom:4px}
  .util-legend .dot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .top-list{list-style:none}
  .top-list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .top-list li:last-child{border-bottom:none}
  .top-list .rank{width:22px;font-weight:800;color:var(--slate);font-size:13px}
  .top-list .tn{font-weight:700;font-size:13.5px}
  .top-list .tbar{flex:1;height:6px;background:var(--canvas);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .top-list .tbar i{display:block;height:100%;background:var(--grad);background-size:200% 200%;animation:gradientShift 6s ease infinite;border-radius:4px}
  .top-list .tv{font-weight:800;font-size:13px;min-width:44px;text-align:right}
  .search{display:flex;align-items:center;gap:8px;background:var(--canvas);border:1px solid var(--line);
    border-radius:10px;padding:6px 12px;min-width:160px}
  .search input{border:none;background:none;outline:none;font-size:14px;width:100%;font-family:inherit;color:var(--ink)}
  .sel{background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:8px 12px;
    font-size:13px;color:var(--ink);font-family:inherit;font-weight:600;cursor:pointer;transition:0.2s}
  .sel:focus{border-color:var(--highlight);box-shadow:0 0 0 3px var(--blue-soft)}
  .filter-tabs{display:flex;gap:4px;background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:3px}
  .filter-tabs button{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;color:var(--slate);
    cursor:pointer;background:none;border:none;transition:0.2s}
  .filter-tabs button.on{background:var(--surface);color:var(--highlight);box-shadow:0 1px 4px rgba(0,0,0,0.06)}
  .alert-banner{margin-bottom:18px;background:var(--surface);border:1px solid var(--line);
    border-left:4px solid var(--highlight);border-radius:var(--radius);padding:14px 20px;
    display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
  .alert-banner .ic{width:32px;height:32px;border-radius:8px;background:var(--blue-soft);color:var(--highlight);
    display:grid;place-items:center;font-size:16px;font-weight:800;flex-shrink:0}
  .alert-banner b{font-weight:800}.alert-banner .names{color:var(--slate);font-weight:600;font-size:13px;margin-top:2px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;color:var(--slate);font-weight:700;text-transform:uppercase;
    letter-spacing:0.04em;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--canvas)}
  td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.clickable{cursor:pointer;transition:background 0.15s}
  tr.clickable:hover{background:var(--blue-soft)}
  tfoot td{border-top:2px solid var(--line);background:var(--canvas)}
  .cli{display:flex;align-items:center;gap:12px}
  .ca{width:36px;height:36px;border-radius:10px;background:var(--blue-soft);color:var(--highlight);
    display:grid;place-items:center;font-weight:800;font-size:12px;flex-shrink:0}
  .ca.grad{background:var(--grad);background-size:200% 200%;animation:gradientShift 6s ease infinite;color:#fff}
  .cn{font-weight:700}.ce{font-size:12px;color:var(--slate)}
  .gauge{width:120px}
  .gauge .track{height:6px;background:var(--canvas);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .gauge .fill{height:100%;border-radius:4px;transition:width 0.6s ease}
  .gauge .cap{font-size:11px;color:var(--slate);margin-top:4px;font-weight:600}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
  .pill.ok{background:var(--blue-soft);color:var(--highlight)}
  .pill.low{background:var(--amber-soft);color:#D97706}
  .pill.crit{background:var(--red-soft);color:#DC2626}
  .pill.draft{background:transparent;border:1px solid var(--line);color:var(--slate)}
  .pill.todo{background:#E5E7EB;color:#6B7280}
  .pill.in-progress{background:#FFFBEB;color:#D97706}
  .pill.in-review{background:#EEF2FF;color:#6366F1}
  .pill.revision{background:#FEF2F2;color:#DC2626}
  .pill.complete{background:#ECFDF5;color:#059669}
  .pill.priority-high{background:#FEF2F2;color:#DC2626}
  .pill.priority-medium{background:#FFFBEB;color:#D97706}
  .pill.priority-low{background:#EEF2FF;color:#6366F1}
  .pill.tag{background:var(--blue-soft);color:var(--highlight);font-size:10px;padding:2px 8px;gap:3px}
  .pill.tag .tag-remove{font-size:10px;cursor:pointer;color:var(--slate);margin-left:2px;font-weight:700}
  .pill.tag .tag-remove:hover{color:var(--highlight)}
  .assignee-pill{display:inline-flex;align-items:center;gap:4px;background:var(--blue-soft);
    padding:2px 8px 2px 10px;border-radius:14px;font-size:12px;font-weight:600;color:var(--highlight)}
  .assignee-pill .remove-assign{font-size:12px;cursor:pointer;color:var(--slate);font-weight:700;margin-left:2px}
  .assignee-pill .remove-assign:hover{color:var(--highlight)}
  .icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
    display:grid;place-items:center;font-size:14px;color:var(--slate);transition:0.2s;cursor:pointer}
  .icon-btn:hover{background:var(--blue-soft);color:var(--highlight);border-color:var(--highlight);transform:scale(1.05)}
  .row-actions{display:flex;gap:4px;flex-wrap:wrap}
  .empty{padding:40px 20px;text-align:center;color:var(--slate)}
  .empty .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px}
  .feed{list-style:none}
  .feed li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;font-size:13px}
  .feed li:last-child{border-bottom:none}
  .feed .fi{width:30px;height:30px;border-radius:8px;background:var(--blue-soft);color:var(--highlight);
    display:grid;place-items:center;flex-shrink:0;font-size:13px}
  .feed .ft{font-weight:600;line-height:1.4}.feed .fd{color:var(--slate);font-size:11px;margin-top:1px}
  .feed .fa{margin-left:auto;font-weight:800;font-size:13px}
  .fa.plus{color:var(--highlight)}.fa.minus{color:var(--slate)}
  .month-nav{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 16px;margin-bottom:16px;flex-wrap:wrap}
  .mn-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
    font-size:16px;color:var(--slate);display:grid;place-items:center;cursor:pointer;transition:0.2s}
  .mn-btn:hover{background:var(--blue-soft);color:var(--highlight)}
  .mn-label{font-size:17px;font-weight:800;letter-spacing:-0.02em;min-width:140px}
  .mn-total{font-size:13px;color:var(--slate);font-weight:600}.mn-total b{color:var(--ink);font-size:15px}
  .timer-section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 24px;margin-bottom:20px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;
    align-items:center;gap:20px;position:relative;overflow:hidden}
  .timer-section::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);background-size:200% 200%;animation:gradientShift 6s ease infinite}
  .timer-display-wrap{display:flex;flex-direction:column;gap:4px;min-width:180px}
  .timer-display{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;
    background:var(--grad);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 6s ease infinite;line-height:1}
  .timer-break-display{font-size:18px;font-weight:700;color:var(--slate);display:flex;align-items:center;gap:8px}
  .timer-break-display .break-time{color:#F59E0B;font-weight:800}
  .timer-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  document.getElementById('ntDo').onclick=async()=>{const title=document.getElementById('ntTitle').value.trim();if(!title){toast('Enter a title');return;}const assignSelect=document.getElementById('ntAssign');const assignedTo=Array.from(assignSelect.selectedOptions).map(o=>o.value);let clientId = null;if(showClientField){clientId = document.getElementById('ntClient').value;} else {clientId = state.clientId;} // For client, use their own clientId
    const payload={title,description:document.getElementById('ntDesc').value.trim(),status:document.getElementById('ntStatus').value,priority:document.getElementById('ntPriority').value,clientId:clientId,assignedTo:assignedTo,dueDate:document.getElementById('ntDue').value||'',tags:document.getElementById('ntTags').value.split(',').map(s=>s.trim()).filter(Boolean)};
    try{const res=await fetch('https://my-backend-ptmb.onrender.com/api/tasks',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${state.authToken}`},body:JSON.stringify(payload)});if(!res.ok)throw new Error('Failed');toast('Task created!','brand');closeModal();state.isDataLoaded=false;render();}catch(err){toast('Error: '+err.message);}};
}

document.addEventListener('click',function(e){
  const nav=e.target.closest('[data-nav]');
  if(nav){e.preventDefault();const view=nav.dataset.nav;if(view&&state.view!==view){state.view=view;document.getElementById('sidebar').classList.remove('open');render();}}
  const roleBtn=e.target.closest('#roleSwitch button');
  if(roleBtn&&roleBtn.dataset.role&&state.role==='admin'){state.role=roleBtn.dataset.role;state.view=state.role==='user'?'dashboard':state.role==='client'?'clienthome':'dashboard';state.detailId=null;render();}
});
document.getElementById('themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark'; render();};
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.addEventListener('click',e=>{const sb=document.getElementById('sidebar'); if(sb.classList.contains('open')&&!sb.contains(e.target)&&e.target.id!=='menuBtn') sb.classList.remove('open');});
document.getElementById('bellBtn').onclick=e=>{e.stopPropagation(); document.getElementById('notifPanel').classList.toggle('show');};
document.addEventListener('click',e=>{const p=document.getElementById('notifPanel'); if(!p.contains(e.target)&&e.target.id!=='bellBtn') p.classList.remove('show');});
const gs=document.getElementById('globalSearch'),sd=document.getElementById('searchDrop');
gs.oninput=()=>{const q=gs.value.toLowerCase().trim(); if(!q){sd.classList.remove('show'); return;} const hits=state.clients.filter(c=>c.name.toLowerCase().includes(q)).slice(0,6); sd.innerHTML=hits.length?hits.map(c=>'<button data-goto="'+c.id+'"><span class="ca" style="width:28px;height:28px;font-size:11px">'+initials(c.name)+'</span><div><div style="font-weight:700">'+c.name+'</div><div class="ce">'+fmt(remaining(c))+'h remaining</div></div></button>').join(''):'<button disabled style="color:var(--slate)">No clients found</button>'; sd.classList.add('show'); sd.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{state.detailId=b.dataset.goto; state.view='clientDetail'; gs.value=''; sd.classList.remove('show'); render();});};
document.addEventListener('click',e=>{if(!sd.contains(e.target)&&e.target!==gs) sd.classList.remove('show');});
state.team.forEach(m=>{if(!state.userTimers[m.id]){state.userTimers[m.id]={isRunning:false,isOnBreak:false,workingStart:null,breakStart:null,totalWorking:0,totalBreak:0,status:'stopped'};}});
render();
