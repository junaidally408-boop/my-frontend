<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Ally</title>
<style>
  body{font-family:sans-serif;background:#f5f7fa;color:#1a2a4a;margin:0;padding:20px;}
  .btn{background:#1a2a4a;color:#fff;padding:8px 16px;border-radius:6px;border:none;cursor:pointer;}
  .panel{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
  input,select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;margin:4px 0;}
  .field-m{margin-bottom:12px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ============================================================
//  MINIMAL WORKING VERSION (All functions defined)
// ============================================================
const app = document.getElementById('app');
let state = {
  isLoggedIn: false,
  authUser: null,
  authToken: '',
  role: 'admin',
  view: 'dashboard',
  clients: [],
  tasks: [],
  team: [],
  events: [],
  trend: [0,0,0,0,0,0],
  isDataLoaded: false,
  threshold: 10,
  rate: 95,
  worker: 'Ali Raza'
};

const remaining = c => c.purchased - c.consumed;
const fmt = n => (Math.round(n*10)/10).toLocaleString();
const money = n => '$'+Math.round(n).toLocaleString();
const initials = s => s.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const toast = (msg) => alert(msg);
const fmtHM = h => h+'h';

function render(){
  if(!state.isLoggedIn){
    renderLogin();
    return;
  }
  if(!state.isDataLoaded){
    loadData();
    return;
  }
  // Show a simple dashboard
  app.innerHTML = `
    <h1>Dashboard</h1>
    <p>Welcome, ${state.authUser?.name || 'User'}</p>
    <div class="panel">
      <button class="btn" onclick="openLog()">Log hours</button>
      <button class="btn" onclick="openBuy()">Add hours</button>
      <button class="btn" onclick="openNewTask()">New Task</button>
      <button class="btn" onclick="renderTasks()">Tasks</button>
      <button class="btn" onclick="renderTeam()">Team</button>
      <button class="btn" onclick="renderProfile()">Profile</button>
    </div>
  `;
}

function renderLogin(){
  app.innerHTML = `
    <div style="max-width:400px;margin:40px auto;background:#fff;padding:30px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.05);">
      <h2>Welcome Back</h2>
      <input id="loginEmail" placeholder="Email" style="width:100%;padding:8px;margin:6px 0;border:1px solid #ccc;border-radius:6px;">
      <input id="loginPassword" type="password" placeholder="Password" style="width:100%;padding:8px;margin:6px 0;border:1px solid #ccc;border-radius:6px;">
      <button class="btn" onclick="doLogin()">Sign In</button>
    </div>
  `;
}

window.doLogin = async function(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  if(!email || !password){ alert('Fill all fields'); return; }
  try{
    const res = await fetch('https://my-backend-ptmb.onrender.com/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error||'Login failed');
    state.authToken = data.token;
    state.authUser = data.user;
    state.isLoggedIn = true;
    state.role = data.user.role;
    state.isDataLoaded = false;
    localStorage.setItem('va_token', data.token);
    localStorage.setItem('va_user', JSON.stringify(data.user));
    render();
  }catch(e){ alert(e.message); }
};

async function loadData(){
  const headers = {'Authorization':'Bearer '+state.authToken};
  const base = 'https://my-backend-ptmb.onrender.com';
  try{
    const c = await fetch(base+'/api/clients',{headers});
    if(c.ok) state.clients = await c.json();
    const t = await fetch(base+'/api/tasks',{headers});
    if(t.ok) state.tasks = await t.json();
    const tm = await fetch(base+'/api/team',{headers});
    if(tm.ok) state.team = await tm.json();
    state.isDataLoaded = true;
    render();
  }catch(e){ alert('Failed to load data'); }
}

// ===== Modal functions =====
window.openLog = function(){ alert('Log hours modal (simulated)'); };
window.openBuy = function(){ alert('Add hours modal (simulated)'); };
window.openNewTask = function(){ alert('Create new task modal (simulated)'); };
window.renderTasks = function(){ alert('Tasks view (simulated)'); };
window.renderTeam = function(){ alert('Team view (simulated)'); };
window.renderProfile = function(){ alert('Profile view (simulated)'); };

// ===== Session restore =====
const savedToken = localStorage.getItem('va_token');
const savedUser = localStorage.getItem('va_user');
if(savedToken && savedUser){
  state.authToken = savedToken;
  state.authUser = JSON.parse(savedUser);
  state.isLoggedIn = true;
  state.role = state.authUser.role;
}
render();
</script>
</body>
</html>
